[project]
name = "igforge"
version = "0.1.0"
description = "Instagram content generated from what you actually built"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
igforge = "igforge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["igforge"]
